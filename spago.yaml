package:
  name: classless-arbitrary
  publish:
    version: 0.1.2
    license: MIT
    location:
      githubOwner: m-bock
      githubRepo: purescript-classless-arbitrary
  dependencies:
    - arrays: ">=7.1.0 <8.0.0"
    - classless: ">=0.1.0 <0.2.0"
    - either: ">=6.1.0 <7.0.0"
    - enums: ">=6.0.1 <7.0.0"
    - gen: ">=4.0.0 <5.0.0"
    - heterogeneous: ">=0.6.0 <0.8.0"
    - identity: ">=6.0.0 <7.0.0"
    - lists: ">=7.0.0 <8.0.0"
    - maybe: ">=6.0.0 <7.0.0"
    - partial: ">=4.0.0 <5.0.0"
    - prelude: ">=6.0.1 <7.0.0"
    - quickcheck: ">=8.0.1 <9.0.0"
    - record: ">=4.0.0 <5.0.0"
    - st: ">=6.2.0 <7.0.0"
    - strings: ">=6.0.1 <7.0.0"
    - tuples: ">=7.0.0 <8.0.0"
    - type-equality: ">=4.0.1 <5.0.0"
    - typelevel-prelude: ">=7.0.0 <8.0.0"
    - unsafe-coerce: ">=6.0.0 <7.0.0"
  test:
    # The tutorial modules are compile-only; Test.Main has no runtime main.
    main: Test.Main
    dependencies:
      - control: ">=6.0.0 <7.0.0"
workspace: {}
